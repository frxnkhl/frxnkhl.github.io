<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>frxn</title>
  <style>
    @font-face {
      font-family: "F1 Bold";
      src: url("fonts/f1bold.ttf") format("truetype");
      font-display: swap;
    }
    @font-face {
      font-family: "F1 Black";
      src: url("fonts/f1black.ttf") format("truetype");
      font-display: swap;
    }
    @font-face {
      font-family: "F1 Wide";
      src: url("fonts/f1wide.ttf") format("truetype");
      font-display: swap;
    }
    @font-face {
      font-family: "F1 Regular";
      src: url("fonts/f1regular.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "KH Regular";
      src: url("fonts/khregular.otf") format("opentype");
      font-display: swap;
    }
    @font-face {
      font-family: "KH Bold";
      src: url("fonts/khbold.otf") format("opentype");
      font-display: swap;
    }
    @font-face {
      font-family: "KH Light";
      src: url("fonts/khlight.otf") format("opentype");
      font-display: swap;
    }
    @font-face {
      font-family: "Northwell";
      src: url("fonts/northwell.otf") format("opentype");
      font-display: swap;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
 
    body {
      background-color: #060a0f;
      background-image: url("img/bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 32px 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* The track holds two identical groups so the loop is seamless */
    .track {
      display: flex;
      width: max-content;
      animation: scroll 30s linear infinite;
    }

    .group {
      display: flex;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      padding-right: 64px;
      color: #ffffff;
      font-size: 32px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .bold    { font-family: "F1 Bold", system-ui, sans-serif; }
    .black   { font-family: "F1 Black", system-ui, sans-serif; position: relative; top: 2px; }
    .wide    { font-family: "F1 Wide", system-ui, sans-serif; }
    .regular { font-family: "F1 Regular", system-ui, sans-serif; }
    .khregular { font-family: "KH Regular", system-ui, sans-serif; position: relative; top: 4px; }
    .khbold { font-family: "KH Bold", system-ui, sans-serif; position: relative; top: 4px; }
    .khlight { font-family: "KH Light", system-ui, sans-serif; position: relative; top: 4px; }
    .northwell { font-family: "Northwell", system-ui, sans-serif; }

    .nav {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      margin: 20px 0 0 48px;
    }

    .nav-link {
      display: inline-block;
      color: #ffffff;
      font-family: "KH Light", system-ui, sans-serif;
      font-size: 26px;
      text-decoration: none;
    }

    .sub {
      display: none;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .sub.open {
      display: flex;
    }

    /* "my work" fades to 50% only while the league links are showing */
    .nav-link.dim[aria-expanded="true"] {
      opacity: 0.5;
    }

    .sub .nav-link:nth-child(1) { color: #be00ff; }
    .sub .nav-link:nth-child(2) { color: #ffeb00; }
    .sub .nav-link:nth-child(3) { color: #ffffff; }

    .nav-link:hover {
      font-family: "KH Bold", system-ui, sans-serif;
    }

    /* phones: slightly smaller links, nudged a few pixels toward the top-left corner */
    @media (max-width: 600px) {
      .nav {
        margin: 10px 0 0 38px;
      }

      .nav-link {
        font-size: 22px;
      }
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .track { animation: none; }
    }
 
    main {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8eaed;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <div class="track" id="track">
      <div class="group" id="groupA"></div>
      <div class="group" id="groupB" aria-hidden="true"></div>
    </div>
    <nav class="nav">
      <a class="nav-link dim" id="workLink" href="#" aria-expanded="false" aria-controls="workMenu">my work</a>
      <div class="sub" id="workMenu">
        <a class="nav-link" href="drl.html">DRAGON RACING LEAGUE</a>
        <a class="nav-link" href="f1ss.html">F1 SILLY SERIES</a>
      </div>
    </nav>
  </header>

  <main>
    <!-- Your content goes here -->
  </main>

  <script>
    const FONTS = ["bold", "black", "wide", "regular", "khregular", "khbold", "khlight", "northwell"];
    const groupA = document.getElementById("groupA");
    const groupB = document.getElementById("groupB");

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Shuffled "decks" so every font shows up evenly, never the same font twice in a row
    function nextDeck(prev) {
      let deck;
      do { deck = shuffle(FONTS.slice()); } while (deck[0] === prev);
      return deck;
    }

    function build() {
      groupA.innerHTML = "";
      groupB.innerHTML = "";
      const seq = [];
      do {
        seq.push(...nextDeck(seq[seq.length - 1]));
        // the first and last must differ too, so the loop seam looks right
        if (seq[0] === seq[seq.length - 1]) seq.push(...nextDeck(seq[seq.length - 1]));
        groupA.innerHTML = seq.map(f => `<h1 class="${f}">frxn</h1>`).join("");
      } while (groupA.scrollWidth < window.innerWidth * 1.2);

      // second copy is identical so the scroll loops with no gap
      groupB.innerHTML = groupA.innerHTML;
    }

    build();
    // rebuild once fonts have loaded so the width is measured correctly
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);

    // "my work" toggles the three league links
    const workLink = document.getElementById("workLink");
    const workMenu = document.getElementById("workMenu");
    workLink.addEventListener("click", (e) => {
      e.preventDefault();
      const open = workMenu.classList.toggle("open");
      workLink.setAttribute("aria-expanded", String(open));
    });
  </script>
</body>
</html>
